server {
    listen 80;
    listen [::]:80;
    server_name wellfinder.hu www.wellfinder.hu localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for peak performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Static assets with aggressive caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Logos and favicons caching
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Health check probe for Docker / host monitoring
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so users always get fresh app updates immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Custom 404 / error fallback
    error_page 404 /index.html;
}
